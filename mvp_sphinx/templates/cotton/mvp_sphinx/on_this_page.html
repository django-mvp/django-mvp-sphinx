{% load i18n %}
{# @description The current page's own headings, as a named navigation region. #}
{# @prop headings:list | description:"Headings from PageHeadings; never empty, the page draws nothing otherwise." #}
<c-vars headings />

<nav aria-labelledby="mvp-sphinx-on-this-page"
     class="mvp-sphinx-on-this-page sticky self-start overflow-y-auto">
  <h2 id="mvp-sphinx-on-this-page" class="px-3 text-sm font-medium opacity-70">
    {% trans "On this page" %}
  </h2>
  <c-mvp_sphinx.heading_list :headings="headings" class="menu menu-sm w-full" />
</nav>
